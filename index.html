<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for elegant typography -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <div class="border-line">
            <div class="content">
                <p class="tagline">Save The Date</p>
                
                <h1 class="names">Emma & James</h1>
                
                <p class="request">Together with their families, invite you to celebrate their wedding</p>
                
                <div class="details">
                    <p class="date">Saturday, October 16, 2027</p>
                    <p class="time">at 4:00 PM</p>
                    <p class="venue">The Grand Willow Orchards<br>123 Celebration Way, California</p>
                </div>
                
                <button id="rsvpBtn" class="rsvp-button">RSVP Now</button>
            </div>
        </div>
    </div>

    <!-- RSVP Modal Confirmation -->
    <div id="rsvpModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Thank You!</h2>
            <p>Your response has been saved. We look forward to celebrating with you!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
